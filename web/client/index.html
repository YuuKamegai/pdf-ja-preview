<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF 日本語プレビュー</title>
    <!--PDF_JA_TOKEN-->
    <!--PDF_JA_MODEL-->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="toolbar">
      <label class="file">
        <span>PDFを開く</span>
        <input id="file" type="file" accept="application/pdf" aria-label="PDFを開く" />
      </label>

      <span class="group">
        <button id="prev" type="button" aria-label="前のページ">◀</button>
        <input id="page" type="number" min="1" value="1" aria-label="ページ" />
        <span id="page-count" class="muted">/ 0</span>
        <button id="next" type="button" aria-label="次のページ">▶</button>
      </span>

      <span class="group">
        <button id="zoom-out" type="button" aria-label="縮小">−</button>
        <button id="zoom-in" type="button" aria-label="拡大">＋</button>
        <button id="rotate" type="button" aria-label="90度回転">⟳</button>
      </span>

      <span class="group">
        <label for="connection" class="muted">接続</label>
        <select id="connection" aria-label="接続" data-testid="connection"></select>
        <button id="manage-connections" type="button">接続を管理</button>
        <button id="pause" type="button">一時停止</button>
      </span>

      <span class="group">
        <button id="clear-cache" type="button">保存した訳を消す</button>
        <button id="close" type="button">閉じる</button>
      </span>

      <span class="status">
        <span id="extraction-status" data-testid="extraction-status"></span>
        <span id="progress" data-testid="progress" class="muted"></span>
      </span>
    </header>

    <p id="cloud-notice" class="cloud-notice" data-testid="cloud-notice" hidden></p>
    <p id="banner" class="banner" data-testid="banner" hidden></p>

    <main class="split">
      <section id="pdf" class="pane" aria-label="原文"></section>
      <section id="translation" class="pane" aria-label="訳文"></section>
    </main>
    <dialog id="connections" class="connections" data-testid="connections">
      <h2>接続</h2>
      <ul id="connection-list" class="connection-list"></ul>
      <form id="connection-form" class="connection-form" onsubmit="return false">
        <label>名前 <input id="c-name" type="text" required /></label>
        <label>種類
          <select id="c-provider">
            <option value="ollama">ローカル Ollama</option>
            <option value="openai">OpenAI 互換</option>
            <option value="azure">Azure OpenAI</option>
          </select>
        </label>
        <label>送信先 <input id="c-base-url" type="text" required /></label>
        <label>モデル / deployment 名 <input id="c-model" type="text" /></label>
        <label id="c-api-key-row">APIキー
          <input
            id="c-api-key"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="貼り付けて保存"
            aria-label="APIキー"
          />
        </label>
        <label id="c-trust-row" class="trust">
          <input id="c-trust" type="checkbox" />
          原文をこの送信先へ送ることを許可する（原文が外部のサーバーへ出ます）
        </label>
        <p id="c-error" class="banner" data-testid="connection-error" hidden></p>
        <menu>
          <button id="c-save" type="button">保存</button>
          <button id="c-test" type="button">接続テスト</button>
          <button id="c-new" type="button">新規</button>
          <button id="c-close" type="button">閉じる</button>
        </menu>
      </form>
    </dialog>

    <footer class="storage-note">抽出した原文と訳文は、このPCに保存されます。「保存した訳を消す」で文書のキャッシュを削除し、再翻訳します。OCRには対応していません。</footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
